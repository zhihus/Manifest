name: OpenSpec Validation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - 'feature/**'
    paths:
      - "openspec/**"
      - "openspec-rules.md"
      - "workflow/README.*"
      - "scripts/test-todoing-runbook.sh"
      - "scripts/test-todoing-config.py"
      - ".github/workflows/openspec-validation.yml"
  pull_request:
    branches: [develop]
    paths:
      - "openspec/**"
      - "openspec-rules.md"
      - "workflow/README.*"
      - "scripts/test-todoing-runbook.sh"
      - ".github/workflows/openspec-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.16.0

      - name: Check bilingual Todoing runbook contract
        run: bash scripts/test-todoing-runbook.sh

      - name: Validate active changes and specs
        run: openspec validate --all

  archive-completed-change:
    needs: validate
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[archive-openspec]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.16.0
      - name: Archive verified change
        run: openspec archive implement-todoing-manifest-workflow --yes
      - name: Validate archived specifications
        run: openspec validate --all
      - name: Commit archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec/specs openspec/changes/archive
          if git diff --cached --quiet; then
            echo "No OpenSpec archive changes to commit."
            exit 0
          fi
          git commit -m "chore(openspec): archive implement-todoing-manifest-workflow"
          git push origin "HEAD:${{ github.ref_name }}"
